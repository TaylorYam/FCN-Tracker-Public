name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Scanner self-tests
        run: python3 -m unittest discover -s scripts -p "test_*.py"

      - name: Public-content safety scan
        # Optional: a repository secret can supply a private term list
        # (never stored in the repo). The scan runs without it.
        env:
          PUBLIC_SCAN_PRIVATE_TERMS: ${{ secrets.PUBLIC_SCAN_PRIVATE_TERMS }}
        run: python3 scripts/check_public.py

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
